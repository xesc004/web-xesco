<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 0 720 660" width="720" height="660" role="img" aria-labelledby="t" fill="none">
  <title id="t">Robot mascota (happy)</title>
  <defs>
    <linearGradient id="gShell" x1="0.18" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F1F4FA"/>
      <stop offset="0.78" stop-color="#DDE2EB"/>
      <stop offset="1" stop-color="#C3CAD6"/>
    </linearGradient>
    <linearGradient id="gShellSoft" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F1F4FA"/>
      <stop offset="1" stop-color="#DDE2EB"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="0.5" stop-color="#D8DDE6"/>
      <stop offset="1" stop-color="#A9B1BF"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFC98F"/>
      <stop offset="0.35" stop-color="#F5891F"/>
      <stop offset="0.82" stop-color="#D2660B"/>
      <stop offset="1" stop-color="#B4530A"/>
    </linearGradient>
    <linearGradient id="gAccentFlat" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFC98F"/>
      <stop offset="0.45" stop-color="#F5891F"/>
      <stop offset="1" stop-color="#D2660B"/>
    </linearGradient>
    <linearGradient id="gScreen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2E3647"/>
      <stop offset="0.55" stop-color="#101720"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gLed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8FDFF"/>
      <stop offset="0.45" stop-color="#7BE8FF"/>
      <stop offset="1" stop-color="#25C4F2"/>
    </linearGradient>
    <radialGradient id="gGround" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5A6478" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#5A6478" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#5A6478" stop-opacity="0"/>
    </radialGradient>

    <!-- rejilla de LEDs -->
    <pattern id="pDots" width="6.4" height="6.4" patternUnits="userSpaceOnUse">
      <circle cx="3.2" cy="3.2" r="2.55" fill="#FFFFFF"/>
    </pattern>
    <mask id="mDots" maskUnits="userSpaceOnUse" x="160" y="130" width="285" height="210">
      <rect x="160" y="130" width="285" height="210" fill="url(#pDots)"/>
    </mask>
    <pattern id="pScreen" width="6.4" height="6.4" patternUnits="userSpaceOnUse">
      <circle cx="3.2" cy="3.2" r="2.55" fill="#9DB4D6" opacity="0.09"/>
    </pattern>

    <filter id="fGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="cBody"><path d="M300 318 C238 318 184 330 160 348 C138 364 129 386 129 418 C129 444 141 461 166 472 C189 482 240 487 300 487 C360 487 411 482 434 472 C459 461 471 444 471 418 C471 386 462 364 440 348 C416 330 362 318 300 318 Z"/></clipPath>
    <clipPath id="cScreen"><rect x="174" y="145" width="252" height="178" rx="35"/></clipPath>

    <!-- Brazo izquierdo (del codo al puno gira con la pose). Se refleja para el derecho. -->
    <g id="armL">
      <path d="M117 336 L93 375" stroke="url(#gMetal)" stroke-width="42" stroke-linecap="round"/>
      <g stroke="#2B303A" stroke-width="2.6" stroke-linecap="round" opacity="0.35" fill="none">
        <path d="M100 340 L82 366"/>
        <path d="M112 352 L94 378"/>
      </g>
      <ellipse cx="84" cy="379" rx="29" ry="19" transform="rotate(-16 84 379)" fill="url(#gAccent)"/>
      <path d="M70 388 C82 379 106 379 116 388 C124 401 128 426 128 447 C128 460 111 467 92 467 C71 467 55 460 55 447 C55 426 61 401 70 388 Z" fill="url(#gShell)"/>
      <ellipse cx="83" cy="402" rx="19" ry="9" fill="#FFFFFF" opacity="0.7" filter="url(#fSoft)"/>
      <path d="M32 446 h92 a16 16 0 0 1 -2 24 c-14 8 -74 8 -88 0 a16 16 0 0 1 -2 -24 Z" fill="url(#gAccent)"/>
      <path d="M48 468 C48 461 63 456 82 456 C103 456 118 461 118 469 C118 490 108 505 93 507 C72 510 52 499 48 486 Z" fill="url(#gShellSoft)"/>
      <g stroke="url(#gShellSoft)" stroke-width="25" stroke-linecap="round">
        <path d="M110 477 L123 486"/>
        <path d="M99 494 L103 512"/>
        <path d="M78 498 L73 517"/>
        <path d="M59 492 L52 510"/>
      </g>
      <g stroke="#2B303A" stroke-width="2.6" stroke-linecap="round" opacity="0.3" fill="none">
        <path d="M111 486 L92 492"/>
        <path d="M90 492 L70 496"/>
      </g>
    </g>

    <!-- Hombro: no gira, queda soldado al costado de la cabeza -->
    <g id="shoulderL">
      <rect x="103" y="288" width="30" height="62" rx="15" fill="url(#gAccentFlat)"/>
    </g>

    <!-- Pierna izquierda -->
    <g id="legL">
      <rect x="196" y="440" width="58" height="34" rx="12" fill="url(#gMetal)"/>
      <path d="M188 448 H260 C264 486 268 522 271 552 C272 562 266 568 256 568 H192 C182 568 176 562 177 552 C180 522 184 486 188 448 Z" fill="url(#gShell)"/>
      <ellipse cx="222" cy="518" rx="24" ry="23" fill="url(#gAccent)"/>
      <ellipse cx="215" cy="508" rx="9" ry="6" fill="#FFFFFF" opacity="0.45"
               transform="rotate(-25 215 508)"/>
      <rect x="176" y="550" width="96" height="25" rx="12" fill="url(#gAccentFlat)"/>
      <path d="M224 566 C242 566 255 571 262 582 C272 596 278 608 278 618 C278 628 266 633 246 633 H202 C182 633 170 628 170 618 C170 608 176 596 186 582 C193 571 206 566 224 566 Z" fill="url(#gAccent)"/>
      <path d="M224 566 C241 566 253 571 260 582 C269 595 274 606 274 615 C274 624 263 628 245 628 H203 C185 628 174 624 174 615 C174 606 179 595 188 582 C195 571 207 566 224 566 Z" fill="url(#gShell)"/>
      <ellipse cx="208" cy="590" rx="25" ry="9" fill="#FFFFFF" opacity="0.6"
               transform="rotate(-8 208 590)" filter="url(#fSoft)"/>
    </g>

    <!-- Cara LED: se referencia dos veces (halo difuso + version con rejilla) -->
    <g id="ledFace" fill="none" stroke="url(#gLed)" stroke-width="12.5"
       stroke-linecap="round" stroke-linejoin="round">
        <path d="M214 220 Q238 188 262 220"/>
        <path d="M338 220 Q362 188 386 220"/>
        <path d="M248 250 Q300 240 352 250 A52 48 0 0 1 248 250 Z" fill="#7BE8FF" stroke-width="6"/>
    </g>
  </defs>

  <!-- ============================== personaje ============================== -->
  <ellipse id="ground" cx="300" cy="634" rx="185" ry="20" fill="url(#gGround)"/>

  <g id="robot" transform="translate(0 -9)">

    <use href="#legL" id="leg-left" transform="rotate(6 228 458)"/>
    <use href="#legL" id="leg-right" transform="translate(600 0) scale(-1 1) rotate(6 228 458)"/>

    <use href="#armL" id="arm-left" transform="rotate(34 114 344)"/>
    <use href="#armL" id="arm-right" transform="translate(600 0) scale(-1 1) rotate(34 114 344)"/>

    <use href="#shoulderL" id="shoulder-left"/>
    <use href="#shoulderL" id="shoulder-right" transform="translate(600 0) scale(-1 1)"/>

    <g id="body">
      <path d="M300 318 C238 318 184 330 160 348 C138 364 129 386 129 418 C129 444 141 461 166 472 C189 482 240 487 300 487 C360 487 411 482 434 472 C459 461 471 444 471 418 C471 386 462 364 440 348 C416 330 362 318 300 318 Z" fill="url(#gShell)"/>
      <g clip-path="url(#cBody)" stroke="url(#gAccentFlat)" stroke-width="17"
         stroke-linecap="round" fill="none">
        <path d="M141 348 C176 350 202 368 214 396 C226 424 231 456 232 486"/>
        <path d="M459 348 C424 350 398 368 386 396 C374 424 369 456 368 486"/>
      </g>
      <ellipse cx="252" cy="366" rx="66" ry="21" fill="#FFFFFF" opacity="0.7" filter="url(#fSoft)"/>
      <ellipse cx="300" cy="482" rx="104" ry="13" fill="#C3CAD6" opacity="0.35"
               filter="url(#fSoft)"/>
    </g>

    <g id="head" transform="rotate(0 300 344)">
      <g id="antenna">
        <path d="M295 96 L297 48 Q300 43 303 48 L305 96 Z" fill="url(#gMetal)"/>
        <circle cx="300" cy="36" r="14" fill="url(#gAccent)"/>
        <circle cx="296" cy="31" r="4.6" fill="#FFFFFF" opacity="0.6"/>
      </g>

      <g id="ears" fill="url(#gAccentFlat)">
        <rect x="112" y="168" width="44" height="116" rx="22"/>
        <rect x="444" y="168" width="44" height="116" rx="22"/>
      </g>

      <g id="head-trim">
        <rect x="268" y="84" width="64" height="26" rx="9" fill="url(#gMetal)"/>
        <rect x="212" y="88" width="60" height="22" rx="10" fill="url(#gAccentFlat)"/>
        <rect x="328" y="88" width="60" height="22" rx="10" fill="url(#gAccentFlat)"/>
      </g>

      <path id="head-shell" d="M219 88 H381 A88 88 0 0 1 469 176 V310 A44 44 0 0 1 425 354 H175 A44 44 0 0 1 131 310 V176 A88 88 0 0 1 219 88 Z" fill="url(#gShell)"/>
      <rect x="180" y="102" width="172" height="48" rx="24" fill="url(#gGloss)"
            opacity="0.85" filter="url(#fSoft)"/>

      <g id="screen">
        <rect x="162" y="133" width="276" height="202" rx="46" fill="url(#gAccent)"/>
        <rect x="168" y="139" width="264" height="190" rx="41" fill="none"
              stroke="#FFC98F" stroke-opacity="0.5" stroke-width="3"/>
        <rect x="174" y="145" width="252" height="178" rx="35" fill="url(#gScreen)"/>
        <rect x="174" y="145" width="252" height="178" rx="35" fill="url(#pScreen)"/>

        <g id="face" clip-path="url(#cScreen)">
          <use href="#ledFace" filter="url(#fGlow)" opacity="0.9"/>
          <use href="#ledFace" mask="url(#mDots)"/>
        </g>

        <rect x="186" y="152" width="120" height="44" rx="22" fill="#FFFFFF"
              opacity="0.07" filter="url(#fSoft)"/>
      </g>
    </g>
  </g>
</svg>
